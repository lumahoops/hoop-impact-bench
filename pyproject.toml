[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoop-impact-bench"
version = "1.1.0"
description = "Hoop Impact Bench (HIB): an open, reproducible benchmark for NBA player impact metrics (RAPM, EPM, DARKO, LEBRON, BPM and your own)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (code); CC BY 4.0 (data)" }
authors = [{ name = "Ayomide Awoyemi, LUMA Basketball Research" }]
keywords = ["nba", "basketball", "analytics", "impact metric", "rapm", "benchmark", "retrodiction", "sports analytics"]
dependencies = ["numpy>=1.22", "pandas>=2.0"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering", "Intended Audience :: Science/Research"]

[project.urls]
Homepage = "https://github.com/lumahoops/hoop-impact-bench"
Source = "https://github.com/lumahoops/hoop-impact-bench"
Issues = "https://github.com/lumahoops/hoop-impact-bench/issues"
"LUMA Basketball Research" = "https://lumahoops.org"

[project.scripts]
hib = "hoop_impact_bench.hib_cli:run_eval"
hib-check = "hoop_impact_bench.hib_cli:run_check"

[tool.setuptools]
package-dir = { "hoop_impact_bench" = "." }
packages = ["hoop_impact_bench"]
include-package-data = false

[tool.setuptools.package-data]
hoop_impact_bench = ["data/*.csv", "ratings/*", "reference/*.csv", "launch/*", "results/*", "tools/*.py", "LICENSE", "LICENSE-DATA", "CITATION.cff"]
